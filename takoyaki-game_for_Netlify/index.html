<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <!-- スマホで見たときに適切なサイズで表示するための魔法の1行 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>たこ焼きゲーム</title>
  <style>
    body { font-family: sans-serif; text-align: center; background-color: #fff5e6; }
    .tako-container { display: flex; justify-content: center; align-items: center; margin-bottom: 15px; gap: 10px; }
    .takoyaki { width: 220px; height: 50px; font-size: 14px; cursor: pointer; border-radius: 25px; border: 2px solid #8b4513; background: white; }
    .pickup-btn { height: 50px; width: 60px; background-color: #ffcc00; border: 1px solid #333; border-radius: 10px; cursor: pointer; font-weight: bold; }
    .pickup-btn:disabled { background-color: #ccc; cursor: not-allowed; }
    #final-score-btn { padding: 15px 30px; font-size: 18px; background-color: #ff4500; color: white; border: none; border-radius: 5px; cursor: pointer; margin-top: 20px; }
  </style>
</head>
<body>

<h2>たこ焼き職人</h2>
<p>ボタンで反転、横の「出す」で完成！</p>

<div class="tako-container">
  <button class="takoyaki">空</button>
  <button class="pickup-btn">出す</button>
</div>
<div class="tako-container">
  <button class="takoyaki">空</button>
  <button class="pickup-btn">出す</button>
</div>
<div class="tako-container">
  <button class="takoyaki">空</button>
  <button class="pickup-btn">出す</button>
</div>

<button id="final-score-btn">最終結果発表</button>

<script>
// --- 要素の取得 ---
var takoButtons = document.querySelectorAll(".takoyaki");
var pickupButtons = document.querySelectorAll(".pickup-btn");
var scoreBtn = document.getElementById("final-score-btn");

// 焼き加減判定の関数
function getStatus(time) {
  if (time < 4) return "生";
  if (time < 8) return "半焼け";
  if (time < 12) return "よく焼け";
  return "焦げ";
}

// --- 各たこ焼きの処理 ---
takoButtons.forEach(function(button, index) {
  // 初期データのセット
  button.side = 1;
  button.started = false;
  button.isFinished = false;
  button.omoteTotal = 0;
  button.uraTotal = 0;
  button.startTime = 0;

  // 1. メインボタン（焼く・ひっくり返す）
  button.addEventListener("click", function() {
    if (button.isFinished) return;

    if (!button.started) {
      button.started = true;
      button.startTime = Date.now();
      button.textContent = "【表】を焼き中...";
      return;
    }

    var seconds = (Date.now() - button.startTime) / 1000;

    if (button.side === 1) {
      button.omoteTotal += seconds;
      button.textContent = "【裏】を焼き中... (表:" + getStatus(button.omoteTotal) + ")";
      button.side = 0;
    } else {
      button.uraTotal += seconds;
      button.textContent = "【表】を焼き中... (裏:" + getStatus(button.uraTotal) + ")";
      button.side = 1;
    }
    button.startTime = Date.now();
  });

  // 2. 出すボタンの処理
  var myPickupBtn = pickupButtons[index];
  myPickupBtn.addEventListener("click", function() {
    if (!button.started || button.isFinished) return;

    var seconds = (Date.now() - button.startTime) / 1000;
    if (button.side === 1) button.omoteTotal += seconds;
    else button.uraTotal += seconds;

    button.isFinished = true;
    button.style.backgroundColor = "#ddd";
    button.textContent = "完成！(表:" + getStatus(button.omoteTotal) + "/裏:" + getStatus(button.uraTotal) + ")";
    myPickupBtn.disabled = true;
  });
});

// 3. 最終スコアボタン
scoreBtn.addEventListener("click", function() {
  var total = 0;
  var count = 0;
  takoButtons.forEach(function(btn) {
    if (btn.isFinished) {
      count++;
      [btn.omoteTotal, btn.uraTotal].forEach(function(time) {
        if (time >= 8 && time < 12) total += 50;
        else if (time >= 4 && time < 8) total += 20;
      });
    }
  });

  if (count === 0) {
    alert("まずはたこ焼きを焼いて皿に出してね！");
  } else {
    alert("合計スコア: " + total + "点！\n（300点満点中）");
  }
});
</script>
</body>
</html>
