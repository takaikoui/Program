<!DOCTYPE html>
<html>
<body>

<h1 id="count">0</h1>

<button onclick="plus()">＋</button>
<button onclick="minus()">−</button>

<script>
let count = 0;

function plus() {
  count = count + 1;
  document.getElementById("count").innerText = count;
}

function minus() {
  count = count - 1;
  document.getElementById("count").innerText = count;
}
</script>

</body>
</html>
