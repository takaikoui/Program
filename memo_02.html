<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>メモ帳フォルダ付き</title>
	<style>
		.textarea {
			width: 100%;
			height: 300px;
		}
		.left {
			width: 30%;
		}
		.right{
			width: 70%;
		}
		#container {
			display: flex;
			width: 100%;
		}
		/* 🔽 これを追加！出力された <p> タグの改行を有効にする設定 */
		#output p {
			white-space: pre-wrap;
			word-break: break-all; /* 長い文章が枠からはみ出すのを防ぐ設定 */
		}
	</style>
</head>
<body>
	<div id="container">
		<section class="left">
			<p>フォルダがここに作られます</p>
			<div id="folders">
			</div>
		</section>
		<section class="right">
			<p>メモ帳フォルダ付、localHolderに保存します</p>
			<textarea id="textarea" class="textarea" placeholder="ここにテキストを書いてください"></textarea>
			<button id=button>下にアウトプットを出します</button>
			<div id="output"></div>
		</section>
	</div>
	<script>
		let textarea = document.getElementById("textarea");
		let button = document.getElementById("button");
		let output = document.getElementById("output");

		button.addEventListener("click", function(){

			let text = textarea.value;

			if (text === "") { 
			    return;
			}
			let memoList = JSON.parse(localStorage.getItem("myMemos")) || [];

			let textOutput = document.createElement("p");
			textOutput.textContent = text;
			textOutput.id = "memo" + (memoList.length + 1);
			output.prepend(textOutput);

			// ★ 罠②修正：配列に追加して localStorage に保存！
			memoList.push(text);
			localStorage.setItem("myMemos", JSON.stringify(memoList));

			// 入力欄をクリア
			textarea.value = "";

		})

	</script>
</body>
</html>
