<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>メモアプリ</title>

<style>
  body {
    font-family: sans-serif;
    text-align: center;
    padding: 40px;
  }

  input {
    font-size: 18px;
    padding: 8px;
    width: 250px;
  }

  button {
    font-size: 18px;
    padding: 8px 12px;
    margin-left: 5px;
  }

  ul {
    list-style: none;
    padding: 0;
    margin-top: 20px;
  }

  li {
    background: #f2f2f2;
    margin: 8px auto;
    padding: 10px;
    width: 300px;
    display: flex;
    justify-content: space-between;
  }

  .delete {
    color: red;
    cursor: pointer;
  }
</style>
</head>

<body>

<h1>メモアプリ</h1>

<input id="text" placeholder="メモを書く">
<button id="add">追加</button>

<ul id="list"></ul>

<script>
const input = document.getElementById("text");
const addBtn = document.getElementById("add");
const list = document.getElementById("list");

// 追加
addBtn.addEventListener("click", function() {

  const value = input.value;
  if (value === "") return;

  const li = document.createElement("li");

  li.innerHTML = `
    <span>${value}</span>
    <span class="delete">削除</span>
  `;

  // 削除機能
  li.querySelector(".delete").addEventListener("click", function() {
    li.remove();
  });

  list.appendChild(li);

  input.value = "";
});
</script>

</body>
</html>
