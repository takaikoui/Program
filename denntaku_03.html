<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>電卓（evalなし）</title>
<style>
  body {
    font-family: sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background: #f0f0f0;
  }
  .calculator {
    background: #222;
    padding: 20px;
    border-radius: 10px;
  }
  #display {
    width: 100%;
    height: 50px;
    font-size: 24px;
    margin-bottom: 10px;
    text-align: right;
    padding: 5px;
  }
  button {
    width: 50px;
    height: 50px;
    margin: 5px;
    font-size: 18px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
  }
  .operator { background: orange; color: white; }
  .equal { background: green; color: white; }
  .clear { background: red; color: white; }
</style>
</head>
<body>

<div class="calculator">
<input type="text" id="display" disabled>

<div>
  <button onclick="clearAll()" class="clear">C</button>
  <button onclick="setOperator('/')" class="operator">÷</button>
  <button onclick="setOperator('*')" class="operator">×</button>
  <button onclick="setOperator('-')" class="operator">−</button>
</div>

<div>
  <button onclick="appendNumber('7')">7</button>
  <button onclick="appendNumber('8')">8</button>
  <button onclick="appendNumber('9')">9</button>
  <button onclick="setOperator('+')" class="operator">+</button>
</div>

<div>
  <button onclick="appendNumber('4')">4</button>
  <button onclick="appendNumber('5')">5</button>
  <button onclick="appendNumber('6')">6</button>
  <button onclick="deleteLast()">⌫</button>
</div>

<div>
  <button onclick="appendNumber('1')">1</button>
  <button onclick="appendNumber('2')">2</button>
  <button onclick="appendNumber('3')">3</button>
</div>

<div>
  <button onclick="appendNumber('0')">0</button>
  <button onclick="appendDot()">.</button>
  <button onclick="calculate()" class="equal">=</button>
  <button onclick="toggleSign()">±</button>
</div>
</div>

<script>
let current = "";
let previous = "";
let operator = null;

function updateDisplay(value) {
  document.getElementById("display").value = value;
}

function appendNumber(num) {
  current += num;
  updateDisplay(current);
}

function appendDot() {
  if (!current.includes(".")) {
    current += ".";
    updateDisplay(current);
  }
}

function setOperator(op) {
  if (current === "") return;

  if (previous !== "") {
    calculate();
  }

  operator = op;
  previous = current;
  current = "";
}

function calculate() {
  if (previous === "" || current === "" || operator === null) return;

  const a = parseFloat(previous);
  const b = parseFloat(current);
  let result;

  switch (operator) {
    case "+": result = a + b; break;
    case "-": result = a - b; break;
    case "*": result = a * b; break;
    case "/":
      if (b === 0) {
        updateDisplay("エラー");
        reset();
        return;
      }
      result = a / b;
      break;
  }

  current = result.toString();
  previous = "";
  operator = null;
  updateDisplay(current);
}

function clearAll() {
  reset();
  updateDisplay("");
}

function reset() {
  current = "";
  previous = "";
  operator = null;
}
function deleteLast() {
  current = current.slice(0, -1);
  updateDisplay(current);
}
//キーボード対応
document.addEventListener("keydown", (e) => {
  if (!isNaN(e.key)) {
    appendNumber(e.key);
  }

  if (["+", "-", "*", "/"].includes(e.key)) {
    setOperator(e.key);
  }

  if (e.key === "Enter") {
    calculate();
  }

  if (e.key === "Backspace") {
    deleteLast();
  }

  if (e.key === ".") {
    appendDot();
  }
});
//反転ボタン
function toggleSign() {
  if (current === "") return;

  if (current.startsWith("-")) {
    current = current.slice(1);
  } else {
    current = "-" + current;
  }

  updateDisplay(current);
}
</script>

</body>
</html>
