<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>確実・重いデータ読み込みテスト（シミュレーター版）</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: sans-serif;
      background-color: #f8f9fa;
    }

    #loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(255, 255, 255, 0.95);
      display: flex; 
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      
      opacity: 0;
      visibility: hidden;
      pointer-events: none; 
      
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }

    #loading-screen.show {
      opacity: 1;
      visibility: visible;
      pointer-events: auto; 
    }

    .spinner {
      width: 50px;
      height: 50px;
      border: 5px solid #e0e0e0;
      border-top: 5px solid #3498db;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .main-content {
      max-width: 600px;
      margin: 50px auto;
      text-align: center;
      padding: 20px;
    }
    
    button {
      padding: 15px 30px;
      font-size: 18px;
      cursor: pointer;
      background-color: #2ecc71;
      color: white;
      border: none;
      border-radius: 5px;
      font-weight: bold;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    
    #image-container {
      margin-top: 30px;
    }
    #image-container img {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
    }
  </style>
</head>
<body>

  <div id="loading-screen">
    <div class="spinner"></div>
    <p style="margin-top: 15px; font-weight: bold; font-size: 18px;">大容量データ（仮想70MB）を処理中...</p>
    <p style="font-size: 13px; color: #7f8c8d; margin-top: 5px;">※300msを超えたためスピナーを表示しています</p>
  </div>

  <main class="main-content">
    <h1>重いデータ通信テスト（確定動作版）</h1>
    <p>下のボタンを押すと、プログラム内で**強制的に1秒間の重い読み込み時間**を作り出し、ローディングの挙動を完全に再現します。</p>
    
    <button id="download-btn">重いデータを読み込む（1秒待機）</button>
    
    <div id="image-container"></div>
  </main>

  <script>
var loadingScreen = document.getElementById('loading-screen');
var imageContainer = document.getElementById('image-container');
// 💡 ボタンの要素をJavaScript側で取得
var downloadBtn = document.getElementById('download-btn');
var timerId = null;

async function downloadHeavyData() {
  // 1. 表示のリセット
  imageContainer.textContent = "通信を開始しました...";
  
  // 100ミリ秒経ったらスピナーを出す
  timerId = setTimeout(function() {
    loadingScreen.classList.add('show');
  }, 100); 

  try {
    var response = await fetch('https://picsum.photos/v2/list?page=1&limit=1');
    
    if (!response.ok) {
      throw new Error('データの取得に失敗しました');
    }

    var data = await response.json();
    var imageUrl = data[0].download_url;
    
    // 2. ローディング文字をクリア
    imageContainer.textContent = "";

    // 3. 安全に <img> タグを生成して追加
    var imgElement = document.createElement('img');
    imgElement.src = imageUrl;
    imgElement.alt = "取得した画像";
    imgElement.style.maxWidth = "100%";
    
    imageContainer.appendChild(imgElement);

  } catch (error) {
    console.error(error);
    imageContainer.textContent = "エラーが発生しました。再度お試しください。";
    
  } finally {
    // 4. 成功・失敗に関わらず、通信が終わったら必ずスピナーを止める
    clearTimeout(timerId); 
    loadingScreen.classList.remove('show'); 
  }
}

// 💡 【ここが重要ポイント！】
// ボタン要素に対して、「クリック（click）されたら、downloadHeavyData を実行してね」と登録する
downloadBtn.addEventListener('click', downloadHeavyData);
  </script>

</body>
</html>
