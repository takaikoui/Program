<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>毛色シミュレーター</title>

<style>
  body {
    font-family: sans-serif;
    text-align: center;
    padding: 40px;
  }

  select, button {
    font-size: 18px;
    margin: 10px;
    padding: 5px 10px;
  }

  #result {
    font-size: 40px;
    margin-top: 20px;
    font-weight: bold;
  }
</style>
</head>

<body>

<h1>毛色シミュレーター</h1>

<p>母</p>
<select id="mother">
  <option>ブラックサンダー</option>
  <option>サンダーボルト</option>
  <option>メイフラワー</option>
</select>

<p>父</p>
<select id="father">
  <option>ディープサンダー</option>
  <option>テディベア</option>
  <option>タイガーボルト</option>
</select>


<button id="btn">生まれる！</button>

<div id="result">？</div>

<script>
var coat {"栗毛"=10,"鹿毛"=40,"青鹿毛"=30};
var hasirikata{"逃げ"=25,"先行"=25,"差し"=25,"追い"=25};
var temper{"激しい","冷静","臆病"};
//weignt
const weightMother = {
    "ブラックサンダー": { power: 90, speed: 70, temper: "激しい",coat:"栗毛",hasirikata:"逃げ", weight: 10 },
    "サンダーボルト":   { power: 75, speed: 95, temper: "冷静",coat:"鹿毛", hasirikata:"先行",weight: 30 },
    "メイフラワー":     { power: 60, speed: 80, temper: "臆病",coat:"青鹿毛",hasirikata:"差し",weight: 60 },
};
const weightFather = {
    "ディープサンダー": { power: 90, speed: 70, temper: "激しい",coat:"栗毛",hasirikata:"逃げ", weight: 10 },
    "テディベア":   { power: 75, speed: 95, temper: "冷静",coat:"鹿毛",hasirikata:"差し", weight: 30 },
    "タイガーボルト":     { power: 60, speed: 80, temper: "臆病",coat:"青鹿毛",hasirikata:"追い", weight: 60 },
};
//parents

var button = document.getElementById('btn');
var result = document.getElementById('result');

button.addEventListener("pointerdown", function() {
  var mother = document.getElementById('mother').value;
  var father = document.getElementById('father').value;
  var total = weight[mother]+weight[father];
  const rand = Math.random() * total;

  if (rand < weight[mother]) {
    child = mother;
    result.textContent = child;
  } else {
    child = father;
    result.textContent = child;
  }


})

</script>

</body>
</html>
