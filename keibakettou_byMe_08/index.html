<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>毛色シミュレーター & SVG馬描画</title>

<style>
  body {
    font-family: sans-serif;
    text-align: center;
    padding: 40px;
    background-color: #f5f5f5;
  }

  .container {
    max-width: 650px;
    margin: 0 auto;
    background: white;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
  }

  select, button {
    font-size: 18px;
    margin: 10px;
    padding: 5px 10px;
  }

  /* 背景色と文字色の固定 */
  #result {
    font-size: 20px;
    margin-top: 20px;
    font-weight: bold;
    color: #333333; /* 常に濃いグレー（黒に近い色） */
    background-color: transparent; /* 背景は常に透明 */
    padding: 10px 0;
  }

  /* Canvasのスタイル */
  canvas {
    margin-top: 20px;
    border: 1px solid #ddd;
    background-color: #fdfdfd;
    border-radius: 8px;
  }
</style>
</head>

<body>

<div class="container">
  <h1>毛色シミュレーター</h1>

  <p>母</p>
  <select id="mother">
    <option id="mother001" class="horses">ブラックサンダー</option>
    <option id="mother002" class="horses">サンダーボルト</option>
    <option id="mother003" class="horses">メイフラワー</option>
  </select>

  <p>父</p>
  <select id="father">
    <option id="father001" class="horses">ディープサンダー</option>
    <option id="father002" class="horses">テディベア</option>
    <option id="father003" class="horses">タイガーボルト</option>
  </select>

  <br>
  <button id="btn">生まれる！</button>

  <div id="result">？</div>
  
  <br>
  <canvas id="horseCanvas" width="500" height="500"></canvas>
</div>

<script>
var coatColor = {"栗毛": 10, "鹿毛": 40, "青鹿毛": 30};
var hasirikataBase = {"逃げ": 25, "先行": 25, "差し": 25, "追い": 25};
var temperBase = {"激しい":33, "冷静":33, "臆病":33};

const weightMother = {
    "ブラックサンダー": { power: 90, speed: 70, temper: "激しい",coat:"栗毛",hasirikata:"逃げ", weight: 10 },
    "サンダーボルト":   { power: 75, speed: 95, temper: "冷静",coat:"鹿毛", hasirikata:"先行",weight: 30 },
    "メイフラワー":     { power: 60, speed: 80, temper: "臆病",coat:"青鹿毛",hasirikata:"差し",weight: 60 },
};
const weightFather = {
    "ディープサンダー": { power: 90, speed: 70, temper: "激しい",coat:"栗毛",hasirikata:"逃げ", weight: 10 },
    "テディベア":       { power: 75, speed: 95, temper: "冷静",coat:"鹿毛",hasirikata:"差し", weight: 30 },
    "タイガーボルト":   { power: 60, speed: 80, temper: "臆防",coat:"青鹿毛",hasirikata:"追い", weight: 60 },
};

var button = document.getElementById('btn');
var result = document.getElementById('result');

const canvas = document.getElementById('horseCanvas');
const ctx = canvas.getContext('2d');

// SVGパスデータ
const horsePath = new Path2D("M1205 12703 c-25 -82 -37 -106 -81 -158 l-53 -62 6 -282 c3 -154 3 -281 -1 -281 -4 0 -33 20 -64 44 -42 32 -83 51 -157 74 l-100 31 -137 -27 c-76 -15 -138 -25 -138 -22 0 3 -9 57 -21 120 -20 111 -23 120 -103 255 -45 77 -101 182 -126 232 -24 51 -48 89 -53 84 -4 -4 -35 -59 -68 -122 l-59 -114 -19 -190 -19 -190 51 -142 51 -141 57 -27 57 -28 -78 -151 c-68 -130 -84 -171 -115 -295 l-36 -144 31 -141 c19 -90 35 -204 44 -316 10 -125 27 -241 61 -405 45 -223 95 -544 95 -611 0 -57 69 -321 146 -560 l74 -231 75 -56 75 -57 97 0 c96 0 319 32 334 47 4 5 36 154 72 333 l64 325 17 -40 c10 -22 42 -101 73 -175 37 -89 144 -292 316 -600 l260 -465 313 -445 313 -445 1 -96 0 -95 100 -268 99 -267 12 -262 12 -262 119 -162 c66 -90 131 -171 146 -182 15 -10 63 -37 107 -59 l81 -40 73 -464 72 -463 6 -500 c5 -476 4 -507 -16 -637 -26 -167 -26 -198 -1 -363 27 -178 26 -472 -1 -930 -16 -265 -25 -363 -35 -371 -8 -6 -38 -148 -74 -349 l-61 -338 -43 -58 c-24 -32 -70 -100 -102 -152 -57 -94 -58 -94 -175 -168 -112 -70 -121 -79 -185 -169 -41 -57 -116 -142 -187 -210 -82 -78 -126 -129 -138 -158 -11 -24 -19 -45 -19 -48 0 -2 35 -22 78 -43 l79 -40 284 -12 c276 -12 287 -11 387 9 114 24 131 34 213 119 l55 58 -7 150 c-8 140 -7 154 14 213 15 43 31 71 50 84 16 11 30 19 31 17 2 -2 14 -26 28 -52 l24 -48 50 63 c114 142 156 217 203 358 l45 135 3 425 c1 234 9 578 17 766 l14 340 37 75 c21 41 59 148 85 239 l47 165 7 235 c7 227 8 242 51 440 38 178 46 236 60 445 15 226 22 291 31 282 2 -2 33 -185 69 -408 37 -231 96 -549 138 -744 l74 -340 76 -115 76 -115 41 -520 41 -520 55 -232 56 -231 -41 -67 c-22 -37 -82 -149 -132 -249 -78 -154 -111 -206 -219 -346 -69 -91 -161 -212 -204 -269 l-78 -103 39 -40 40 -40 354 9 354 8 112 170 c62 94 113 177 113 185 0 9 -27 59 -59 113 -33 53 -59 97 -58 97 1 0 32 -9 69 -19 l67 -19 6 46 c21 174 37 231 131 439 64 143 64 144 64 237 0 89 -2 98 -46 197 -26 57 -68 160 -94 229 -43 114 -48 136 -54 241 -5 84 -16 152 -41 245 -33 124 -35 136 -35 304 1 111 7 224 19 310 15 117 16 142 4 185 -7 28 button.addEventListener("pointerdown", function() {
  var mother = document.getElementById('mother').value;
  var father = document.getElementById('father').value;
  
  var motherData = weightMother[mother];
  var fatherData = weightFather[father];

  var speedRandom = Math.floor(Math.random() * 31)-15;
  var powerRandom = Math.floor(Math.random() * 31)-15;

  var motherCoatRandom = coatColor[motherData.coat];
  var fatherCoatRandom = coatColor[fatherData.coat];
  var coatRandom = motherCoatRandom + fatherCoatRandom;
  var childCoat = "";
  var diceCoat = Math.random() * coatRandom;
  if ( diceCoat < motherCoatRandom) {
    childCoat = motherData.coat;
  } else {
    childCoat = fatherData.coat;
  }
  
  var keysHasirikata = Object.keys(hasirikataBase);
  var childHasirikata = keysHasirikata[Math.floor(Math.random() * keysHasirikata.length)];

  var keysTemper = Object.keys(temperBase);
  var childTemper = keysTemper[Math.floor(Math.random() * keysTemper.length)];

  var childData = {
    speed : Math.floor((motherData.speed + fatherData.speed) / 2) + speedRandom,
    power : Math.floor((motherData.power + fatherData.power) / 2) + powerRandom,
    coatColor : childCoat,
    hasirikataBase : childHasirikata,
    temperBase : childTemper
  };

  result.textContent = "仔馬誕生！ 毛色:" + childData.coatColor + " / 脚質:" + childData.hasirikataBase + " / 性格:" + childData.temperBase + " / スピード:" + childData.speed + " / パワー:" + childData.power;

  // --- 馬の毛色のみ変数を切り替え（テキスト用スタイルは削除） ---
  let horseColor = "#2c3e50";

  if (childData.coatColor === "栗毛") {
      horseColor = "#b87333";
  } else if (childData.coatColor === "鹿毛") {
      horseColor = "#704214";
  } else if (childData.coatColor === "青鹿毛") {
      horseColor = "#2b2b2b";
  }

  // --- Canvasの描画処理 ---
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  ctx.save();
  ctx.translate(50, 470); 
  ctx.scale(0.035, -0.035); 

  ctx.shadowColor = 'rgba(0, 0, 0, 0.2)';
  ctx.shadowBlur = 100;
  ctx.shadowOffsetX = 100;
  ctx.shadowOffsetY = -100;

  ctx.fillStyle = horseColor; 
  ctx.fill(horsePath);

  ctx.restore();
})
</script>

</body>
</html>
