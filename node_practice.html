
<script>
  const http = require('http');

// サーバーの仕組みを作る
const server = http.createServer((req, res) => {
  res.writeHead(200, { 'Content-Type': 'text/plain; charset=utf-8' });
  res.end('Hello, Node.jsのサーバーへようこそ！\n');
});

// ポート番号3000で待ち受け開始
server.listen(3000, () => {
  console.log('サーバーが http://localhost:3000 で起動しました');
});
</script>
