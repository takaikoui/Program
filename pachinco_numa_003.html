<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>長押しカウンター</title>
</head>
<body>
<h1>パチンコ沼突破で一億円</h1>
    <div id="counter">0</div>
    <div></div>
    <button id="btn">長押しでカウント</button>

    <h2>一条の声</h2>
    <p id="ichijo">Loading...</p>

    <h2>かかった金</h2>
    <p id="money">0</p>

    <h2>初めの役物通過</h2>
    <p id="first">0</p>
    <h2>次のクルーン突破</h2>
    <p id="second">0</p>
    <h2>最後のクルーン突破</h2>
    <p id="third">0</p>


    <script>
        let count = 0;
        let timer = null;
        const interval = 50; // 0.05秒ごとにカウントアップ

        // レート設定
        let rate = 4000;
        let moneyRate = 0;

        // 確率設定（統一）
        const firstOdds = 50;  // 1/50
        const secondOdds = 3;  // 1/3
        const thirdOdds = 5;   // 1/5

        // それぞれの通過数を数える変数
        let firstPassCount = 0;
        let secondPassCount = 0;
        let thirdPassCount = 0;

        // ゲームの状態を管理する変数（フラグ）
        let isCleared = false;   // 大当たりしたらtrue
        let saidFirst = false;   // 「第一のクルーンが…」を言ったらtrue
        let saidSecond = false;  // 「第二のクルーンが…」を言ったらtrue

        // 画面のパーツ（HTML要素）を取得
        const counterEl = document.getElementById('counter');
        const btn = document.getElementById('btn');
        const money = document.getElementById('money');
        const firstEl = document.getElementById('first');
        const secondEl = document.getElementById('second');
        const thirdEl = document.getElementById('third');
        const ichijoEl = document.getElementById('ichijo');

        // 一条のセリフ初期化
        (() => {
            ichijoEl.textContent = "ふっふっふ……沼へようこそ……。";
        })();

        // スマホでボタンを長押しした時に画面が引っ張られたりメニューが出たりするのをJSで防止
        btn.style.touchAction = 'none';
        btn.style.userSelect = 'none';
        btn.style.webkitUserSelect = 'none';

        // カウント開始
        function start(e) {
            if (isCleared || timer !== null) return;
            
            // タッチ時のデフォルト動作（ズームやメニュー表示）を抑制
            if (e && e.cancelable) e.preventDefault();

            timer = setInterval(() => {
                count++;
                moneyRate += rate;
                counterEl.textContent = count;
                money.textContent = moneyRate.toLocaleString() + "円";
                checkFirstYakumono();
            }, interval);
        }

        // カウント停止
        function stop() {
            if (timer !== null) {
                clearInterval(timer);
                timer = null;
            }
        }

        // 【1. 初めの役物】
        function checkFirstYakumono() {
            if (isCleared) return;

            if (Math.random() * firstOdds < 1) {
                firstPassCount++;
                firstEl.textContent = firstPassCount;
                checkSecondCroon(); // 突破したら第二へ
            }
        }

        // 【2. 次のクルーン（手前）】
        function checkSecondCroon() {
            if (isCleared) return;

            if (!saidFirst) {
                ichijoEl.textContent = "第一の役物が・・・";
                saidFirst = true;
            }

            if (Math.random() * secondOdds < 1) {
                secondPassCount++;
                secondEl.textContent = secondPassCount;
                checkThirdCroon(); // 突破したら第三へ
            }
        }

        // 【3. 最後のクルーン（奥）】
        function checkThirdCroon() {
            if (isCleared) return;

            if (!saidSecond) {
                ichijoEl.textContent = "第二のクルーンが・・・";
                saidSecond = true;
            }

            if (Math.random() * thirdOdds < 1) {
                thirdPassCount++;
                thirdEl.textContent = thirdPassCount;

                isCleared = true;

                // 大当たり演出
                ichijoEl.textContent = "バカな…！あり得ん…！この沼が破られるなど…！！一億円獲得…！！";
                ichijoEl.style.color = "red";
                ichijoEl.style.fontWeight = "bold";

                stop(); // タイマーを止める
            }
        }

        // --- スマホ＆PC共通（Pointer Events） ---
        btn.addEventListener('pointerdown', (e) => {
            // 指が多少ボタンから外れてもしっかり押しっぱなし判定を維持
            btn.setPointerCapture(e.pointerId);
            start(e);
        });

        btn.addEventListener('pointerup', stop);
        btn.addEventListener('pointercancel', stop);

    </script>
</body>
</html>
